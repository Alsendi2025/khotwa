  <body>
    <!-- حاوية التطبيق الرئيسية مع واجهة تحميل أولية محسّنة وآلية إنقاذ عاطلي التحميل -->
    <div id="root">
      <div id="khotwa-loader-ui" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; direction: rtl; padding: 20px; text-align: center;">
        <div style="border: 4px solid #e2e8f0; border-top: 4px solid #0d4f47; border-radius: 50%; width: 48px; height: 48px; animation: khotwa-spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 20px; color: #0d4f47; font-size: 18px; font-weight: 700;">خطوة — منصة الطالب الذكية</h2>
        <p id="khotwa-loader-msg" style="margin-top: 6px; color: #64748b; font-size: 14px;">جاري تحميل الخدمات والأدوات...</p>
        
        <!-- زر إنقاذ يظهر تلقائياً في حال بطء الشبكة الشديد -->
        <button id="khotwa-reload-btn" onclick="window.location.reload()" style="display: none; margin-top: 16px; background-color: #0d4f47; color: #ffffff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600;">
          إعادة التحميل الآن 🔄
        </button>
      </div>
      <style>
        @keyframes khotwa-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>

      <!-- Global lightweight client-side safety and fallback handlers (show reload on errors/timeouts) -->
      <script>
        (function(){
          function getMsg(){ return document.getElementById('khotwa-loader-msg'); }
          function getBtn(){ return document.getElementById('khotwa-reload-btn'); }
          function getUi(){ return document.getElementById('khotwa-loader-ui'); }
          function showError(text){
            try{
              var m = getMsg(); var b = getBtn(); var ui = getUi();
              if (m) m.textContent = text || 'فشل تحميل التطبيق. اضغط لإعادة المحاولة.';
              if (b) b.style.display = 'inline-block';
              if (ui) ui.style.backgroundColor = '#fff7f7';
            }catch(e){console.error(e)}
          }

          window.addEventListener('error', function(e){
            console.error('Window error captured:', e.error || e.message || e);
            showError('حدث خطأ في الصفحة — حاول إعادة التحميل.');
          });

          window.addEventListener('unhandledrejection', function(e){
            console.error('Unhandled promise rejection:', e.reason || e);
            showError('فشل تحميل بعض الموارد — حاول إعادة التحميل.');
          });

          // If the app signals it mounted, hide the static loader
          window.addEventListener('khotwa:app-mounted', function(){
            try{ var ui = getUi(); if (ui) ui.style.display = 'none'; } catch(e){}
          });

          // Timeout fallback (15s) to avoid spinner forever on very slow networks
          setTimeout(function(){
            var ui = getUi();
            if (ui && ui.style.display !== 'none') {
              showError('يبدو أن التطبيق يستغرق وقتًا طويلاً للتحميل. يمكنك إعادة المحاولة.');
            }
          }, 15000);
        })();
      </script>

    </div>

    <!-- تحميل تطبيق React الرئيسي بـ DEFER لضمان الأولوية -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ترحيل سكربتات التتبع والأدوات للعمل في الخلفية دون تعطيل التحميل -->
    <script>
      window.addEventListener('load', function() {
        // Arena Recorder Script (Delayed execution)
        (function(){

          var SK="__arena_rec",RRWEB_CDN="https://cdn.jsdelivr.net/npm/rrweb@2.0.0-alpha.4/dist/rrweb.min.js";
          var MAX_RECORDING_MS=600000,MAX_RRWEB_EVENTS=30000,MAX_INTERACTIONS=5000,MAX_CURSOR_POINTS=10000,recStopped=false;
          var stored=null;try{var raw=sessionStorage.getItem(SK);if(raw)stored=JSON.parse(raw);}catch(ex){}

          var interactions=stored?stored.i||[]:[],cursorPath=stored?stored.c||[]:[],lastCursorSample=0,lastScrollSample=0;
          var pageHeight=document.documentElement.scrollHeight;
          var viewport={width:window.innerWidth,height:window.innerHeight};
          function isCapped(){if(recStopped)return true;if(Date.now()-startTime>=MAX_RECORDING_MS){recStopped=true;return true;}return false;}
          function persist(){try{var d=JSON.stringify({r:rrwebEvents,i:interactions,c:cursorPath,m:meta,st:startTime});sessionStorage.setItem(SK,d);}catch(ex){rrwebEvents=rrwebEvents.slice(Math.floor(rrwebEvents.length/2));try{sessionStorage.setItem(SK,JSON.stringify({r:rrwebEvents,i:interactions,c:cursorPath,m:meta,st:startTime}));}catch(ex2){}}}
          setInterval(persist,5000);
          window.addEventListener("resize",function(){viewport={width:window.innerWidth,height:window.innerHeight};pageHeight=document.documentElement.scrollHeight;});
          document.addEventListener("click",function(e){if(isCapped()||interactions.length>=MAX_INTERACTIONS)return;var el=e.target;var tag=el.tagName?el.tagName.toLowerCase():"";var text=(el.textContent||"").trim().substring(0,80);var classes=el.className&&typeof el.className==="string"?el.className.substring(0,120):"";interactions.push({type:"click",t:Date.now()-startTime,x:Math.round(e.clientX),y:Math.round(e.clientY),element:{tag:tag,text:text,classes:classes}});},true);
          window.addEventListener("scroll",function(){if(isCapped()||interactions.length>=MAX_INTERACTIONS)return;var now=Date.now();if(now-lastScrollSample<200)return;lastScrollSample=now;var scrollY=Math.round(window.scrollY||window.pageYOffset||0);var depthPct=pageHeight>viewport.height?Math.min(100,Math.round(((scrollY+viewport.height)/pageHeight)*100)):100;interactions.push({type:"scroll",t:now-startTime,y:scrollY,depth_pct:depthPct});},{passive:true});
          document.addEventListener("mousemove",function(e){if(isCapped()||cursorPath.length>=MAX_CURSOR_POINTS)return;var now=Date.now();if(now-lastCursorSample<250)return;lastCursorSample=now;cursorPath.push([Math.round(e.clientX),Math.round(e.clientY),now-startTime]);},{passive:true});
          document.addEventListener("keydown",function(e){if(isCapped()||interactions.length>=MAX_INTERACTIONS)return;if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))return;interactions.push({type:"keydown",t:Date.now()-startTime,key:e.key});},true);
          function buildAnalytics(){if(!meta)return null;var ph=document.documentElement.scrollHeight;var maxScroll=0,clickElements={},firstClick=null,firstScroll=null,totalDistance=0;for(var i=0;[
          }
          function loadRrweb(){if(rrwebStarted)return;rrwebStarted=true;var s=document.createElement("script");s.src=RRWEB_CDN;s.onload=function(){var rec=(window.rrweb&&window.rrweb.record)||window.rrweb_record;try{if(rec)rec({emit:function(e){rrwebEvents.push(e);if(rrwebEvents.length>MAX_RRWEB_EVENTS)rrwebEvents.shift();}});}catch(err){}};document.body.appendChild(s);} 
          window.addEventListener("message",function(e){if(!e.data||typeof e.data.type!=="string")return;if(e.data.type==="arena:init"){if(!meta)startTime=Date.now();meta={generationId:e.data.generationId};} });
          // NOTE: do NOT auto-load rrweb here on load. It will be loaded lazily after the app mounts to avoid blocking mobile.
          // loadRrweb();
        })();

        // Arena Views Script (only if top frame)
        (function(){var isTop=false;try{isTop=window.self===window.top;}catch(e){}if(!isTop)return;window.__ARENA_META={};})();
      });
    </script>

    <!-- Defer rrweb until the app mounts and only on non-mobile devices -->
    <script>
      (function(){
        function loadRrwebNow() {
          try {
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/rrweb@2.0.0-alpha.4/dist/rrweb.min.js';
            s.defer = true;
            document.body.appendChild(s);
            console.info('rrweb lazy-loaded');
          } catch (e) { console.error('failed to lazy-load rrweb', e); }
        }
        window.addEventListener('khotwa:app-mounted', function(){
          // don't load rrweb automatically on mobile devices
          var ua = navigator.userAgent || '';
          if (/Mobi|Android|iPhone|iPad/i.test(ua)) return;
          // small delay to avoid competing for bandwidth immediately after mount
          setTimeout(loadRrwebNow, 1200);
        });
      })();
    </script>

        function removeOverlay() { if (overlay) { overlay.remove(); overlay = null; } if (label) { label.remove(); label = null; } }
